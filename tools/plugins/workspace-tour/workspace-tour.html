<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workspace Tour</title>
  <link rel="icon" href="data:,">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      font-family: adobe-clean, -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 13px; background: transparent; color: #1d1d1d; overflow: hidden;
    }
    #launcher { display: flex; flex-direction: column; height: 100%; background: #fafafa; }
    #launcher h2 { font-size: 14px; font-weight: 700; padding: 14px 16px 10px; border-bottom: 1px solid #e8e8e8; }
    .tour-list { flex: 1; overflow-y: auto; padding: 10px; }
    .tour-card {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 12px; margin-bottom: 8px; border-radius: 8px;
      border: 1px solid #e0e0e0; background: #fff; cursor: pointer;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .tour-card:hover, .tour-card:focus {
      border-color: #7155fa; box-shadow: 0 2px 8px rgba(113,85,250,0.12); outline: none;
    }
    .tour-card-icon { font-size: 22px; flex-shrink: 0; line-height: 1; margin-top: 2px; }
    .tour-card-body { flex: 1; }
    .tour-card-title { font-weight: 700; font-size: 13px; margin-bottom: 2px; }
    .tour-card-desc { font-size: 12px; color: #666; line-height: 1.4; }
    .tour-badge {
      font-size: 10px; font-weight: 700; padding: 2px 6px;
      border-radius: 10px; white-space: nowrap; flex-shrink: 0; margin-top: 2px;
    }
    .tour-badge.new { background: #e8f5e9; color: #1b7c1b; }
    .tour-badge.done { background: #f0f0f0; color: #888; }
    .launcher-footer { padding: 12px 16px; border-top: 1px solid #e8e8e8; text-align: center; }
    .reset-btn {
      display: block; width: 100%; background: none; border: none;
      color: #7155fa; font-size: 11px; cursor: pointer; text-decoration: underline; padding: 0;
    }
    #tour-panel { display: none; flex-direction: column; height: 100%; background: #fff; }
    #tour-panel.visible { display: flex; }
    .tp-header {
      display: flex; align-items: center; gap: 8px;
      padding: 12px 14px 10px; border-bottom: 1px solid #e8e8e8;
      background: linear-gradient(135deg, #f8f6ff 0%, #fff 100%);
    }
    .tp-tour-icon { font-size: 18px; }
    .tp-title { flex: 1; font-weight: 700; font-size: 13px; }
    .tp-step-count { font-size: 11px; color: #888; white-space: nowrap; }
    .tp-close {
      background: none; border: none; cursor: pointer;
      color: #666; font-size: 16px; padding: 2px 4px; border-radius: 4px;
    }
    .tp-close:hover { background: #f0f0f0; }
    .tp-close:focus { outline: 2px solid #7155fa; outline-offset: 1px; }
    .tp-dots {
      display: flex; justify-content: center; gap: 5px;
      padding: 8px 14px 6px; flex-wrap: wrap;
    }
    .tp-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #ddd; border: none; padding: 0; cursor: pointer;
      transition: background 0.15s, transform 0.15s;
    }
    .tp-dot.active { background: #7155fa; transform: scale(1.35); }
    .tp-dot.visited { background: #b39af7; }
    .tp-dot:focus { outline: 2px solid #7155fa; outline-offset: 2px; }
    .tp-content { flex: 1; overflow-y: auto; padding: 16px 16px 10px; }
    .step-emoji { font-size: 28px; margin-bottom: 10px; display: block; }
    .step-heading { font-size: 15px; font-weight: 700; margin-bottom: 8px; line-height: 1.3; }
    .step-body { font-size: 12.5px; line-height: 1.6; color: #444; }
    .step-body p { margin-bottom: 8px; }
    .step-body p:last-child { margin-bottom: 0; }
    .step-body strong { color: #1d1d1d; }
    .step-body ul { padding-left: 16px; margin-bottom: 8px; }
    .step-body ul li { margin-bottom: 4px; }
    .step-body code {
      background: #f4f4f4; border: 1px solid #e0e0e0;
      padding: 1px 5px; border-radius: 3px;
      font-size: 11px; font-family: 'Courier New', monospace;
    }
    .tip-box {
      background: #f8f6ff; border-left: 3px solid #7155fa;
      padding: 8px 10px; border-radius: 0 6px 6px 0;
      margin: 10px 0; font-size: 12px; color: #4a3c7c;
    }
    .warn-box {
      background: #fff8e1; border-left: 3px solid #e8a000;
      padding: 8px 10px; border-radius: 0 6px 6px 0;
      margin: 10px 0; font-size: 12px; color: #5a4400;
    }
    .tag-row { display: flex; flex-wrap: wrap; gap: 5px; margin: 8px 0; }
    .tag {
      font-size: 11px; font-weight: 600; padding: 2px 8px;
      border-radius: 10px; background: #f0eeff; color: #5338d4; border: 1px solid #d9d0ff;
    }
    .tag.green { background: #e8f5e9; color: #1b7c1b; border-color: #b7ddb9; }
    .tag.orange { background: #fff3e0; color: #b45309; border-color: #fcd9a0; }
    .advanced-toggle { margin-top: 12px; border-top: 1px dashed #ddd; padding-top: 10px; }
    .advanced-toggle summary {
      cursor: pointer; font-size: 11.5px; font-weight: 700; color: #7155fa;
      list-style: none; display: flex; align-items: center; gap: 5px; user-select: none;
    }
    .advanced-toggle summary::-webkit-details-marker { display: none; }
    .advanced-toggle summary::before { content: '▶'; font-size: 9px; transition: transform 0.15s; }
    .advanced-toggle[open] summary::before { transform: rotate(90deg); }
    .advanced-toggle .adv-body { margin-top: 8px; font-size: 12px; line-height: 1.6; color: #555; }
    .advanced-toggle .adv-body p { margin-bottom: 6px; }
    .advanced-toggle .adv-body code {
      background: #f4f4f4; border: 1px solid #e0e0e0;
      padding: 1px 5px; border-radius: 3px; font-size: 11px; font-family: 'Courier New', monospace;
    }
    .tp-footer { padding: 10px 14px; border-top: 1px solid #e8e8e8; display: flex; flex-direction: column; gap: 8px; }
    .tp-nav { display: flex; align-items: center; gap: 8px; }
    .btn-nav {
      flex: 1; padding: 7px 0; border-radius: 16px;
      border: 1px solid #ccc; background: #fff; cursor: pointer;
      font-size: 12px; font-weight: 600; color: #444; transition: border-color 0.15s;
    }
    .btn-nav:hover:not(:disabled) { border-color: #7155fa; color: #7155fa; }
    .btn-nav:disabled { opacity: 0.4; cursor: default; }
    .btn-nav.primary {
      background: linear-gradient(95deg, #b539c8, #7155fa, #3b63fb);
      color: #fff; border: none;
    }
    .btn-nav:focus { outline: 2px solid #7155fa; outline-offset: 2px; }
    .tp-footer-bottom { display: flex; justify-content: space-between; align-items: center; }
    .btn-dna {
      background: none; border: none; color: #999; font-size: 11px;
      cursor: pointer; text-decoration: underline; padding: 0;
    }
    .btn-all-tours {
      background: none; border: none; color: #7155fa;
      font-size: 11px; cursor: pointer; font-weight: 600; padding: 0;
    }
    .btn-all-tours:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div id="launcher" role="main" aria-label="Workspace Tour Launcher">
    <h2>&#x1F5FA; Workspace Tours</h2>
    <div class="tour-list" id="tour-list" role="list"></div>
    <div class="launcher-footer">
      <button class="reset-btn" id="btn-reset-all">Reset all tour progress</button>
    </div>
  </div>

  <div id="tour-panel" role="dialog" aria-modal="true" aria-labelledby="tp-title-text">
    <div class="tp-header">
      <span class="tp-tour-icon" id="tp-tour-icon" aria-hidden="true"></span>
      <span class="tp-title" id="tp-title-text"></span>
      <span class="tp-step-count" id="tp-step-count" aria-live="polite"></span>
      <button class="tp-close" id="btn-close" aria-label="Close tour">&#x2715;</button>
    </div>
    <div class="tp-dots" id="tp-dots" role="tablist" aria-label="Tour steps"></div>
    <div class="tp-content" id="tp-content" tabindex="0"></div>
    <div class="tp-footer">
      <div class="tp-nav">
        <button class="btn-nav" id="btn-prev" aria-label="Previous step">&#x2190; Back</button>
        <button class="btn-nav primary" id="btn-next" aria-label="Next step">Next &#x2192;</button>
      </div>
      <div class="tp-footer-bottom">
        <button class="btn-all-tours" id="btn-all-tours">All tours</button>
        <button class="btn-dna" id="btn-dna">Don&#39;t show again</button>
      </div>
    </div>
  </div>

  <script src="https://da.live/nx/utils/sdk.js" type="module"></script>
  <script src="/tools/plugins/workspace-tour/workspace-tour.js" type="module"></script>
</body>
</html>
