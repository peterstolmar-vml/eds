<!DOCTYPE html>
<html>
  <head>
    <title>Media Browser</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:,">
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html { display: flex; min-height: 100%; min-width: 100%; }
      body {
        display: flex; flex-direction: column;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 13px; min-height: 100%; min-width: 100%;
        background: #f5f4fe; color: #1a1a2e;
      }

      /* ── Toolbar ── */
      .toolbar {
        display: flex; align-items: center; gap: 6px;
        padding: 10px 12px; background: #fff;
        border-bottom: 1px solid #e0dfff;
        flex-shrink: 0;
      }
      .breadcrumb {
        flex: 1; display: flex; align-items: center; gap: 4px;
        font-size: 12px; overflow: hidden;
      }
      .breadcrumb span {
        color: #7155fa; cursor: pointer; white-space: nowrap;
        max-width: 80px; overflow: hidden; text-overflow: ellipsis;
      }
      .breadcrumb span:last-child { color: #333; cursor: default; font-weight: 600; }
      .breadcrumb .sep { color: #bbb; font-size: 10px; }
      .search {
        flex: 0 0 auto; width: 140px; padding: 5px 8px;
        border: 1px solid #ddd; border-radius: 16px;
        font-size: 12px; outline: none; background: #fafafa;
      }
      .search:focus { border-color: #7155fa; background: #fff; }
      .sort-btn {
        background: none; border: 1px solid #ddd; border-radius: 16px;
        padding: 5px 10px; font-size: 11px; cursor: pointer; color: #555;
        white-space: nowrap;
      }
      .sort-btn:hover { border-color: #7155fa; color: #7155fa; }
      .view-btn {
        background: none; border: none; cursor: pointer;
        font-size: 16px; padding: 4px; opacity: 0.5;
      }
      .view-btn.active { opacity: 1; color: #7155fa; }

      /* ── Upload drop zone ── */
      .upload-hint {
        margin: 8px 12px 0; padding: 6px 10px;
        background: #fff8e1; border: 1px dashed #f0c040;
        border-radius: 6px; font-size: 11px; color: #886600; text-align: center;
      }

      /* ── Grid / List ── */
      .grid-area {
        flex: 1; overflow-y: auto; padding: 10px 10px 60px;
      }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px,1fr)); gap: 8px; }
      .list-view .grid { grid-template-columns: 1fr; gap: 4px; }

      .media-card {
        background: #fff; border: 2px solid transparent;
        border-radius: 8px; cursor: pointer; overflow: hidden;
        transition: border-color 0.15s, box-shadow 0.15s;
        display: flex; flex-direction: column;
      }
      .media-card:hover { border-color: #7155fa; box-shadow: 0 2px 8px rgba(113,85,250,0.15); }
      .media-card.selected { border-color: #b539c8; box-shadow: 0 0 0 3px rgba(181,57,200,0.2); }

      .thumb-wrap {
        width: 100%; aspect-ratio: 1; overflow: hidden;
        background: #f0eeff; display: flex; align-items: center; justify-content: center;
      }
      .list-view .thumb-wrap { width: 44px; height: 44px; flex-shrink: 0; border-radius: 6px; }
      .thumb-wrap img { width: 100%; height: 100%; object-fit: cover; }
      .thumb-wrap .folder-icon { font-size: 32px; }
      .thumb-wrap .file-icon { font-size: 28px; color: #aaa; }

      .card-label {
        padding: 4px 5px; font-size: 10px; font-weight: 600;
        color: #444; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        text-align: center;
      }
      .list-view .media-card {
        flex-direction: row; align-items: center;
        gap: 10px; padding: 6px 10px; border-radius: 6px;
      }
      .list-view .card-label {
        flex: 1; text-align: left; font-size: 12px; padding: 0;
      }
      .list-view .card-meta { font-size: 10px; color: #999; white-space: nowrap; }

      /* ── Selection bar ── */
      .sel-bar {
        position: fixed; bottom: 0; left: 0; right: 0;
        background: linear-gradient(95deg, #b539c8, #7155fa, #3b63fb);
        color: #fff; display: flex; align-items: center; gap: 10px;
        padding: 10px 14px; transform: translateY(100%);
        transition: transform 0.2s; z-index: 100; font-size: 13px;
      }
      .sel-bar.visible { transform: translateY(0); }
      .sel-bar-label { flex: 1; font-weight: 600; }
      .sel-btn {
        background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.4);
        color: #fff; border-radius: 16px; padding: 5px 14px;
        cursor: pointer; font-size: 12px; font-weight: 600;
      }
      .sel-btn:hover { background: rgba(255,255,255,0.35); }
      .sel-btn.clear { background: none; border-color: transparent; opacity: 0.7; }

      /* ── Alt text modal ── */
      .modal-backdrop {
        position: fixed; inset: 0; background: rgba(0,0,0,0.4);
        display: none; align-items: center; justify-content: center; z-index: 200;
      }
      .modal-backdrop.open { display: flex; }
      .modal {
        background: #fff; border-radius: 12px; padding: 20px 24px;
        width: 300px; box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        display: flex; flex-direction: column; gap: 12px;
      }
      .modal h3 { font-size: 14px; color: #1a1a2e; }
      .modal label { font-size: 12px; color: #555; display: block; margin-bottom: 4px; }
      .modal input {
        width: 100%; padding: 7px 10px; border: 1px solid #ddd;
        border-radius: 6px; font-size: 13px; outline: none;
      }
      .modal input:focus { border-color: #7155fa; }
      .modal .thumb-preview {
        width: 100%; height: 120px; background: #f0eeff; border-radius: 8px;
        overflow: hidden; display: flex; align-items: center; justify-content: center;
      }
      .modal .thumb-preview img { max-width: 100%; max-height: 100%; object-fit: contain; }
      .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
      .modal-btn {
        padding: 7px 18px; border-radius: 16px; border: 1px solid #ddd;
        cursor: pointer; font-size: 13px; font-weight: 600; background: #fff;
      }
      .modal-btn.primary {
        background: linear-gradient(95deg, #b539c8, #7155fa);
        color: #fff; border: none;
      }

      /* ── Empty / loading ── */
      .empty { text-align: center; color: #aaa; padding: 32px 16px; }
      .loader { text-align: center; padding: 32px; color: #7155fa; font-size: 20px; }
    </style>
  </head>
  <body>

    <div class="toolbar">
      <div class="breadcrumb" id="breadcrumb"></div>
      <input class="search" id="search" type="search" placeholder="Search…" />
      <button class="sort-btn" id="sort-btn" title="Sort">Name ↑</button>
      <button class="view-btn active" id="view-grid" title="Grid">⊞</button>
      <button class="view-btn" id="view-list" title="List">☰</button>
    </div>

    <div class="upload-hint">📎 Upload via DA file panel · browse &amp; insert here</div>

    <div class="grid-area" id="grid-area">
      <div class="loader">Loading…</div>
    </div>

    <div class="sel-bar" id="sel-bar">
      <span class="sel-bar-label" id="sel-label">1 item selected</span>
      <button class="sel-btn clear" id="btn-deselect">✕ Clear</button>
      <button class="sel-btn" id="btn-copy-url">Copy URL</button>
      <button class="sel-btn" id="btn-insert">Insert ↩</button>
    </div>

    <div class="modal-backdrop" id="modal">
      <div class="modal">
        <h3>Insert Image</h3>
        <div class="thumb-preview"><img id="modal-thumb" src="" alt="" /></div>
        <div>
          <label for="alt-input">Alt text <span style="color:#aaa;font-weight:400">(describe the image)</span></label>
          <input id="alt-input" type="text" placeholder="e.g. A purple city skyline at dusk" />
        </div>
        <div class="modal-actions">
          <button class="modal-btn" id="modal-cancel">Cancel</button>
          <button class="modal-btn primary" id="modal-insert">Insert Image</button>
        </div>
      </div>
    </div>

    <script src="https://da.live/nx/utils/sdk.js" type="module"></script>
    <script src="/tools/plugins/media-browser/media-browser.js" type="module"></script>
  </body>
</html>
